[project]
name = "sessionkit"
version = "0.3.1"
description = "Session Kit gives your Claude Code sessions voice, mail, a phone line and a tmux sidebar, in one install."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha"]
authors = [
    { name = "Mike Bailey", email = "mike@sessionkit.ai" }
]
requires-python = ">=3.11,<3.15"
# The family, one install. Floored at 0.3.0: the kit is released and tested
# with the family's 0.3.0, so it needs every family package at 0.3.0 or
# later, and PyPI's 0.0.1 name placeholders and the 0.1.0 alphas must never
# satisfy these.
# sessiontools and sessionmail are floored at 0.3.1, for what the kit's code
# and docs call on: `sessionkit setup` asks sessiontools 0.3.1's
# `session agent default`, and INSTALL.md describes sessionmail 0.3.1's
# one-run mail setup.
# sessionphone with its media extra: the bot, calls and `sessionphone web` need it.
# sessionvoice with its capture extra, so the ears can hear the room.
# This is the RULED list, kept in tests/_ruled_deps.py with the ruling;
# tests/test_dependency_gate.py fails when these lines, the built wheel or
# uv.lock drift from it.
dependencies = [
    "click>=8.1",
    "sessionmail>=0.3.1",
    "sessiontools>=0.3.1",
    "sessionphone[media]>=0.3.0",
    "sessionview>=0.3.0",
    "sessionvoice[capture]>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/sessionkit/sessionkit"
Repository = "https://github.com/sessionkit/sessionkit"

# The kit's own command, then every child command RE-DECLARED (the
# recommended re-export). `uv tool install` links only the executables of the
# package it is asked for, never its dependencies', so without these lines
# `uv tool install sessionkit` would put `sessionkit` alone on the PATH.
# Each entry point is the child's own target, copied verbatim; re-measure them
# at each child's HEAD whenever a child adds, renames or drops a command.
# Measured from each child's 0.3.0 wheel (entry_points.txt), by wheel sha256:
# mail 8e4d9476, tools 8d089699, phone ac402a39, view 3942f119, voice ebc1b65c.
# sessionview's four commands share one target: `sessionview:main` reads the
# name it was run as and runs that command.
# The kit itself still ships no `session` of its own: `session` below is
# sessiontools' command, re-exported, not a second implementation.
[project.scripts]
sessionkit = "sessionkit.cli:main"
# sessionmail
message = "sessionmail.message:cli"
pager = "sessionmail.pager:cli"
memory = "sessionmail.memory:cli"
# sessiontools
session = "sessiontools.cli:main"
# sessionphone
sessionphone = "sessionphone.cli:main"
# sessionview
sessionview = "sessionview:main"
sessionview-config = "sessionview:main"
sessionview-session = "sessionview:main"
sessionview-messages = "sessionview:main"
# sessionvoice
ears = "ears.cli:main"
ears-serve = "ears.serve:main"
mouth = "mouth.__main__:main"
talk = "talk.cli:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
