[project]
name = "sessionkit"
version = "0.4.0"
description = "Session Kit gives your Claude Code sessions voice, mail, a phone line and a tmux sidebar, in one install."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha"]
authors = [
    { name = "Mike Bailey", email = "mike@sessionkit.ai" }
]
requires-python = ">=3.11,<3.15"
# The family, one install. Floored at 0.3.0: the kit is released and tested
# with the family's 0.3.0, so it needs every family package at 0.3.0 or
# later, and PyPI's 0.0.1 name placeholders and the 0.1.0 alphas must never
# satisfy these.
# Within the 0.4.0 floor below, `sessionkit setup` asks sessiontools for
# `session agent default`, and INSTALL.md describes sessionmail's one-run
# mail setup. Setup also asks sessiontools for the agents folder with
# `session path agent --config --json`.
# That verb ships in sessiontools 0.3.3, below the floor; with a sessiontools
# that lacks it, setup writes no agent file and says so.
# All five are floored at 0.4.0 or later: the family is released together, and
# an older copy of one package beside the others splits its state between the
# old and new folders.
# sessionview from 0.4.0 has its helpers as verbs, and the kit links
# `sessionview` alone. An older sessionview still types
# `sessionview-messages` into its messages tab, which the kit no longer links.
# sessionphone with its media extra: the bot, calls and `sessionphone web` need it.
# sessionvoice with its capture extra, so the ears can hear the room.
# settled, the Settings app, is required too: a hard dependency, never an
# optional extra. It is not a family package: it has its own version line,
# floored at 0.1.0 so PyPI's 0.0.1 name placeholder can never satisfy it, and
# its kit extra brings the kit's tool registry and jsonschema, without which
# it shows none of the kit's tools.
# That extra asks for sessiontools 0.3.3, which the sessiontools line below
# covers.
# This is the RULED list, kept in tests/_ruled_deps.py with the ruling;
# tests/test_dependency_gate.py fails when these lines, the built wheel or
# uv.lock drift from it.
dependencies = [
    "click>=8.1",
    "sessionmail>=0.4.0",
    "sessiontools>=0.4.0",
    "sessionphone[media]>=0.4.0",
    "sessionview>=0.4.0",
    "sessionvoice[capture]>=0.4.0",
    "settled[kit]>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/sessionkit/sessionkit"
Repository = "https://github.com/sessionkit/sessionkit"

# The kit's own command, then every child command RE-DECLARED (the
# recommended re-export). `uv tool install` links only the executables of the
# package it is asked for, never its dependencies', so without these lines
# `uv tool install sessionkit` would put `sessionkit` alone on the PATH.
# Each entry point is the child's own target, copied verbatim; re-measure them
# at each child's HEAD whenever a child adds, renames or drops a command.
# Measured from each child's 0.3.0 wheel (entry_points.txt), by wheel sha256:
# mail 8e4d9476, tools 8d089699, phone ac402a39, view 3942f119, voice ebc1b65c.
# settled: from the settings repo's pyproject at 1487963 and its 0.1.0
# wheel, sha256 d796d326 (re-measure from the staged 0.1.0 wheel, by sha256).
# sessionview ships one command. Its helpers are verbs of it, `sessionview
# config`, `sessionview session` and `sessionview messages`, never on the PATH.
# The kit itself still ships no `session` of its own: `session` below is
# sessiontools' command, re-exported, not a second implementation.
[project.scripts]
sessionkit = "sessionkit.cli:main"
# sessionmail
message = "sessionmail.message:cli"
pager = "sessionmail.pager:cli"
memory = "sessionmail.memory:cli"
# sessiontools
session = "sessiontools.cli:main"
# sessionphone
sessionphone = "sessionphone.cli:main"
# sessionphone's dc-* tools: one console-script target, sessionphone.dctools:main,
# which runs the tool named by argv[0]. uv links only the kit's own scripts, so
# without these lines a kit install leaves them off PATH.
# dc-env (a library the tools source), bridge-check and bin/sessionphone never ship.
dc-answer = "sessionphone.dctools:main"
dc-call = "sessionphone.dctools:main"
dc-call-mix = "sessionphone.dctools:main"
dc-delete = "sessionphone.dctools:main"
dc-dm = "sessionphone.dctools:main"
dc-fetch = "sessionphone.dctools:main"
dc-hangup = "sessionphone.dctools:main"
dc-invite = "sessionphone.dctools:main"
dc-live = "sessionphone.dctools:main"
dc-log = "sessionphone.dctools:main"
dc-log-web = "sessionphone.dctools:main"
dc-react = "sessionphone.dctools:main"
dc-ring = "sessionphone.dctools:main"
dc-say = "sessionphone.dctools:main"
dc-send-file = "sessionphone.dctools:main"
dc-xdc-realtime = "sessionphone.dctools:main"
dc-xdc-update = "sessionphone.dctools:main"
# sessionview
sessionview = "sessionview:main"
# sessionvoice
ears = "ears.cli:main"
ears-serve = "ears.serve:main"
mouth = "mouth.__main__:main"
talk = "talk.cli:main"
# the front door asks it for Talk's room: `sessionvoice-web web-room` (docs/family-web.md)
sessionvoice-web = "talk.web:main"
# settled
settled = "settled.cli:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "dark-launch/tests"]
